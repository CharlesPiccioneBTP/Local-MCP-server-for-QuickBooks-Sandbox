[project]
name = "qbo-mcp"
version = "0.1.0"
description = "Read-only MCP server for a QuickBooks Online sandbox company"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0,<3",
    "httpx>=0.28,<1",
    "anyio>=4",
]

[project.scripts]
qbo-mcp = "qbo_mcp.server:main"
qbo-mcp-setup = "qbo_mcp.auth:main"
qbo-mcp-import = "qbo_mcp.importer:main"
qbo-mcp-doctor = "qbo_mcp.doctor:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qbo_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
